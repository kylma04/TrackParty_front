# Plafond mémoire modéré : évite le swap sur machine <= 20 Go avec Chrome/IDE/Next.js.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
# Timeouts HTTP relevés pour tolérer une connexion lente/instable lors du
# téléchargement des .aar volumineux (ex: io.github.webrtc-sdk, ~48 Mo).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
